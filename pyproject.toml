[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overfit"
version = "0.1.0"
description = "Backtest overfitting detector: CSCV/PBO, Deflated Sharpe Ratio and Minimum Track Record Length (Lopez de Prado)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emilio Gappa", email = "emiliogappa@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]
keywords = ["backtesting", "overfitting", "quant", "sharpe-ratio", "finance"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
overfit = "overfit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/overfit"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
